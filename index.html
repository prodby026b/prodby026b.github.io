<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root{
  /* variable names match the main site; swap values for the exact ones from style.min.css */
  --ink:#1c1c1e;
  --ink-2:#2c2c2e;
  --ink-3:#3a3a3c;
  --paper:#f5f5f7;
  --paper-dim:#a1a1a6;
  --copper:#0a84ff;
  --verdigris:#30d158;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.2);
  --bg-image:url('bg.jpg');
}

*{box-sizing:border-box;}
html{background:var(--ink);}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
  font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
}

/* ---------- quiet photo background ---------- */
.bg{
  position:fixed;inset:0;z-index:0;
  background:var(--bg-image) center/cover no-repeat;
  filter:brightness(.38) saturate(.8) blur(3px);
  transform:scale(1.05);
}
.shade{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(110% 80% at 50% 0%,rgba(28,28,30,.15),rgba(28,28,30,.85)),
    linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55));
}
@media (max-width:600px){ .bg{background-image:url('mobile-bg.jpg');} }

/* ---------- card ---------- */
.card{
  position:relative;z-index:2;
  width:100%;max-width:420px;
  padding:34px 28px 22px;
  background:rgba(28,28,30,.74);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);
  backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 28px 70px rgba(0,0,0,.5);
  animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
}
/* corner ticks, same detail as the frames on the main site */
.card::before,.card::after{
  content:"";position:absolute;width:24px;height:24px;
  border:1px solid var(--copper);opacity:.75;pointer-events:none;
}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:14px;}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:14px;}

@keyframes rise{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:none;}
}

/* ---------- identity ---------- */
.id{display:flex;align-items:center;gap:16px;}
.mark{
  flex:none;width:52px;height:52px;
  display:grid;place-items:center;
  font-family:'Fraunces',Georgia,serif;font-size:1.5rem;font-weight:500;
  color:var(--paper);
  background:linear-gradient(160deg,var(--ink-3),var(--ink-2));
  border:1px solid var(--line-strong);
  border-radius:12px;
}
.name{
  margin:0;
  font-family:'Fraunces',Georgia,serif;
  font-size:1.9rem;font-weight:400;line-height:1.1;letter-spacing:-.015em;
}
.name em{font-style:italic;font-weight:300;color:var(--copper);}
.role{margin:6px 0 0;font-size:.875rem;line-height:1.45;color:var(--paper-dim);}

.status{
  display:inline-flex;align-items:center;gap:8px;
  margin:20px 0 0;padding:5px 12px 5px 10px;
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.7rem;
  color:var(--paper-dim);
  border:1px solid var(--line);border-radius:999px;
}
.status i{
  width:6px;height:6px;border-radius:50%;
  background:var(--verdigris);box-shadow:0 0 8px var(--verdigris);
}

/* ---------- links ---------- */
.links{
  list-style:none;margin:24px 0 0;padding:22px 0 0;
  border-top:1px solid var(--line);
  display:grid;gap:10px;
}
.link{
  display:flex;align-items:center;gap:14px;
  min-height:62px;padding:10px 14px;
  color:var(--paper);text-decoration:none;
  background:rgba(255,255,255,.025);
  border:1px solid var(--line);
  border-radius:10px;
  transition:border-color .2s,background .2s;
}
.ico{
  flex:none;width:40px;height:40px;
  display:grid;place-items:center;
  color:var(--paper-dim);
  background:rgba(0,0,0,.25);
  border:1px solid var(--line);
  border-radius:9px;
  transition:color .2s,border-color .2s;
}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.txt{min-width:0;display:flex;flex-direction:column;gap:3px;}
.k{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.68rem;color:var(--paper-dim);}
.v{font-size:.95rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.go{
  margin-left:auto;flex:none;
  font-size:1rem;color:var(--paper-dim);
  transition:color .2s,transform .2s;
}
.link:hover,
.link:focus-visible{
  background:rgba(255,255,255,.05);
  border-color:var(--line-strong);
  outline:none;
}
.link:focus-visible{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--copper);}
.link:hover .ico,
.link:focus-visible .ico{color:var(--copper);border-color:rgba(10,132,255,.45);}
.link:hover .go,
.link:focus-visible .go{color:var(--paper);transform:translate(2px,-2px);}

.copy{
  margin:22px 0 0;text-align:center;
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.68rem;
  color:var(--paper-dim);opacity:.8;
}

@media (max-width:420px){
  .card{padding:28px 20px 20px;}
  .name{font-size:1.6rem;}
}
@media (prefers-reduced-motion:reduce){
  .card{animation:none;}
  .link,.ico,.go{transition:none;}
}
</style>
</head>
<body>
