<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prodby026b :: gateway</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');

:root{
  --neon:#00fff2;
  --neon-dim:#00b3ab;
  --violet:#b06bff;
  --amber:#ffb020;
  --void:#03050a;
  --panel:rgba(4,10,14,0.72);
  --line:rgba(0,255,242,0.35);
  --bg-image:url('bg.jpg');
}

*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;width:100%;
  background:var(--void);
  font-family:'JetBrains Mono',monospace;
  color:var(--neon);
  overflow:hidden;
}

/* ---------- background layer ---------- */
#bgLayer{
  position:fixed;inset:0;
  background-image:var(--bg-image);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  filter:brightness(0.55) saturate(1.1);
  z-index:0;
}
@media (max-width:600px){
  #bgLayer{ background-image:url('mobile-bg.jpg'); }
}

/* CRT scanlines + vignette overlay */
#scan{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.035) 0px,
    rgba(255,255,255,0.035) 1px,
    transparent 2px,
    transparent 3px
  );
  mix-blend-mode:overlay;
}
#vignette{
  position:fixed;inset:0;z-index:6;pointer-events:none;
  box-shadow:inset 0 0 180px 60px rgba(0,0,0,0.85);
}
#flicker{
  position:fixed;inset:0;z-index:7;pointer-events:none;
  background:rgba(0,255,242,0.02);
  animation:flick 5.5s infinite;
}
@keyframes flick{
  0%,96%,100%{opacity:0;}
  97%{opacity:1;}
  98%{opacity:0;}
  99%{opacity:.6;}
}

/* ---------- top status bar ---------- */
.status-bar{
  position:fixed;top:0;left:0;width:100%;height:34px;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;font-size:.72em;letter-spacing:2px;
  z-index:50;color:var(--neon-dim);
}
.status-bar .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--neon);box-shadow:0 0 8px var(--neon);
  margin-right:6px;animation:blink 1.4s infinite;
}
@keyframes blink{50%{opacity:.25;}}

/* ---------- main terminal window ---------- */
.wrap{
  position:relative;z-index:10;
  height:100%;width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:60px 16px 40px;
}
.terminal{
  width:100%;max-width:480px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:0 0 40px rgba(0,255,242,0.12), inset 0 0 30px rgba(0,255,242,0.03);
  padding:0;
  overflow:hidden;
}
.term-head{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  background:rgba(0,255,242,0.06);
  border-bottom:1px solid var(--line);
  font-size:.68em;letter-spacing:2px;color:var(--neon-dim);
}
.term-head span.led{
  width:8px;height:8px;border-radius:50%;background:var(--neon);
  box-shadow:0 0 6px var(--neon);
}
.term-body{padding:20px 20px 22px;}

.boot-line{
  font-size:.78em;line-height:1.7;color:var(--neon-dim);
  white-space:pre-wrap;
}
.boot-line .ok{color:var(--neon);}
.boot-line .warn{color:var(--amber);}

.title{
  margin:18px 0 4px;
  font-size:1.9em;font-weight:800;letter-spacing:1px;
  color:var(--neon);
  text-shadow:0 0 14px rgba(0,255,242,0.55);
}
.subtitle{
  font-size:.72em;color:var(--violet);letter-spacing:3px;margin-bottom:18px;
}

.link-list{list-style:none;margin:0;padding:0;}
.link-list li{
  border:1px solid var(--line);
  border-radius:4px;
  margin-bottom:10px;
  overflow:hidden;
}
.link-list a{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;
  color:var(--neon);
  text-decoration:none;
  font-size:.85em;
  letter-spacing:.5px;
  transition:background .2s, color .2s, padding-right .2s;
}
.link-list a:hover{
  background:rgba(0,255,242,0.08);
  color:#fff;
}
.link-list a::after{
  content:"›";
  color:var(--violet);
  font-size:1.2em;
}
.link-list .tag{
  font-size:.65em;color:var(--neon-dim);
}

footer{
  position:fixed;bottom:0;left:0;width:100%;
  font-size:.62em;color:var(--neon-dim);
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(4px);
  border-top:1px solid var(--line);
  padding:6px 12px;
  display:flex;justify-content:space-between;
  letter-spacing:1px;z-index:50;
}

@media (max-width:600px){
  .terminal{max-width:100%;}
  .title{font-size:1.5em;}
}
</style>
</head>
<body>

<div id="bgLayer"></div>
<div id="scan"></div>
<div id="vignette"></div>
<div id="flicker"></div>

<div class="status-bar">
  <div><span class="dot"></span>PRODBY026B</div>
  <div id="clock">--:--:--</div>
</div>

<div class="wrap">
  <div class="terminal">
    <div class="term-head">
      <span class="led"></span> root@026b : ~/gateway
    </div>
    <div class="term-body">
      <div class="boot-line" id="bootLine">
&gt; initializing session<span class="ok"> [OK]</span>
&gt; loading identity: <span class="ok">prodby026b</span>
&gt; channels detected: <span class="ok">4</span>
      </div>

      <div class="title">CYBER NEXUS</div>
      <div class="subtitle">// 026b gateway node</div>

      <ul class="link-list">
        <li><a href="https://t.me/prodby026b" target="_blank" rel="noopener">prodby026b <span class="tag">telegram</span></a></li>
        <li><a href="https://pixelchaser.sbs" target="_blank" rel="noopener">pixelchaser.sbs <span class="tag">site</span></a></li>
        <li><a href="https://github.com/prodby026b" target="_blank" rel="noopener">prodby026b <span class="tag">github</span></a></li>
        <li><a href="https://t.me/cipherAlgorithm" target="_blank" rel="noopener">cipherAlgorithm <span class="tag">telegram</span></a></li>
      </ul>
    </div>
  </div>
</div>

<footer>
  <div>net: stable</div>
  <div>log: active</div>
  <div>© prodby026b</div>
</footer>

<script>
  // clock
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toTimeString().split(' ')[0];
  }
  tick(); setInterval(tick, 1000);
</script>

</body>
</html>
